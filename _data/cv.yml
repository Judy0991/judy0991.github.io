      - company: University of Pennsylvania
        position: Student Researcher · MI-EL Synthetic Control Methodology
        location: Philadelphia, PA
        start_date: 2025
        end_date: Present
        summary: "Mentor: Prof. Jing Huang"
        highlights:
          - Developed a multiple-imputation empirical-likelihood synthetic-control framework for treatment-effect estimation with missing pre-intervention donor data.
          - Established theoretical conditions for recovering complete-data synthetic-control weights and evaluated the method through simulations.
          - Applied the framework to longitudinal EHR data in a kidney-stone treatment study; manuscript in preparation for JAMIA.

      - company: Children's Hospital of Philadelphia
        position: Student Researcher · Autism Diagnosis Project
        location: Philadelphia, PA
        start_date: 2026
        end_date: Present
        summary: "Mentor: Prof. Jing Huang"
        highlights:
          - Conducting exploratory analyses of clinical screening data to investigate associations between SWYC measures and ASD diagnosis.
          - Studying heterogeneity in screening performance and potential patterns of underdiagnosis across patient groups.

      - company: Peking University Cancer Hospital & Institute
        position: Research Assistant · Medical Image Analysis
        location: Beijing, China
        start_date: 2024
        end_date: 2025
        summary: "Mentor: Dr. Wei Wang"
        highlights:
          - Compared 3D ResNet50, FCNN, SVM, random forest, and XGBoost models using MRI radiomics data.
          - Identified XGBoost with LASSO-based feature selection as the strongest model for cervical-cancer recurrence prediction.
          - Co-first author on the resulting peer-reviewed publication.

      - company: Local Hospital Medical Innovation Research Department
        position: Research Intern · Virus-Drug Association Prediction
        start_date: 2024
        end_date: 2025
        summary: "Mentor: Dr. Tang Yong"
        highlights:
          - Developed an NMFMCVDA model for predicting unknown virus-drug associations using the HDVD dataset.
          - Achieved 91% predictive accuracy in the project evaluation.

      - company: Beijing Normal University
        position: Student Researcher · Yellow River Basin Water Sustainability
        location: Beijing, China
        start_date: 2023
        end_date: Present
        summary: "Undergraduate thesis mentor: Prof. Changjia Li"
        highlights:
          - Developed a dual-threshold change-point model for blue- and green-water operating boundaries.
          - Combined R, Prophet, and ArcGIS to analyze historical hydrological data and map sustainable water-use conditions.

      - company: Xibei Restaurant and Beijing Normal University
